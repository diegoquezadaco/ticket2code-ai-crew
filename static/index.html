<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ticket → Code</title>
<style>
  :root { --bg:#f6f6f4; --panel:#fff; --text:#1d1d1b; --muted:#6b6b66; --line:#e2e2dd; --accent:#3b5bdb;
          --ok:#1b7f3b; --warn:#b45309; --err:#b42318; --code:#f0f0ec; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#161615; --panel:#1f1f1d; --text:#ecece8; --muted:#9a9a93; --line:#33332f; --accent:#7c93ff;
            --ok:#4ade80; --warn:#fbbf24; --err:#f87171; --code:#2a2a27; }
  }
  * { box-sizing: border-box; }
  body { margin:0; font:15px/1.5 system-ui, sans-serif; background:var(--bg); color:var(--text);
         display:flex; flex-direction:column; height:100vh; }
  header { display:flex; align-items:center; gap:12px; padding:10px 16px; border-bottom:1px solid var(--line); background:var(--panel); }
  header h1 { font-size:16px; margin:0; flex:1; }
  header a, header button { font:inherit; font-size:13px; color:var(--accent); background:none; border:1px solid var(--line);
         border-radius:6px; padding:4px 10px; cursor:pointer; text-decoration:none; }
  #chat { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:12px; max-width:900px; width:100%; margin:0 auto; }
  .msg { padding:10px 14px; border-radius:10px; border:1px solid var(--line); background:var(--panel); max-width:100%; }
  .msg.user { align-self:flex-end; background:var(--accent); color:#fff; border-color:transparent; white-space:pre-wrap; }
  .msg.error { border-color:var(--err); color:var(--err); }
  .text { white-space:pre-wrap; word-break:break-word; }
  pre { background:var(--code); border-radius:6px; padding:10px; overflow-x:auto; margin:8px 0; font-size:13px; }
  .badge { display:inline-block; font-size:12px; font-weight:600; padding:2px 8px; border-radius:99px; border:1px solid currentColor; margin-bottom:6px; }
  .badge.approved { color:var(--ok); } .badge.not_approved { color:var(--warn); } .badge.answer { color:var(--muted); }
  details.log { margin-bottom:8px; font-size:13px; }
  details.log > summary { cursor:pointer; color:var(--muted); }
  .row { padding:2px 0; border-bottom:1px dashed var(--line); }
  .row .t { color:var(--muted); font-variant-numeric:tabular-nums; margin-right:6px; }
  .row .a { font-weight:600; margin-right:6px; }
  .a.router { color:#8a63d2; } .a.planner { color:#2b8aa8; } .a.coder { color:#c2570c; }
  .a.checks { color:var(--muted); } .a.reviewer { color:var(--ok); } .a.system { color:var(--err); } .a.assistant { color:var(--accent); }
  .row pre { font-size:12px; margin:4px 0; max-height:240px; }
  form { display:flex; gap:8px; padding:12px 16px; border-top:1px solid var(--line); background:var(--panel); max-width:900px; width:100%; margin:0 auto; }
  textarea { flex:1; resize:none; font:inherit; padding:8px 10px; border:1px solid var(--line); border-radius:8px; background:var(--bg); color:var(--text); }
  #send { font:inherit; padding:0 18px; border:0; border-radius:8px; background:var(--accent); color:#fff; cursor:pointer; }
  #send:disabled { opacity:.5; cursor:wait; }
  .hint { color:var(--muted); font-size:13px; }
  .code-block { position: relative; margin: 8px 0; }
  .code-block pre {
    margin: 0;
    padding: 36px 12px 12px;
    max-height: 360px;
    overflow: auto;
    background: var(--code);
    border-radius: 8px;
  }
  .copy-code {
    position: absolute;
    top: 6px;
    right: 6px;
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 4px 8px;
    background: var(--panel);
    color: var(--text);
    cursor: pointer;
  }
  .markdown p { margin: 8px 0; }
  .markdown h1, .markdown h2, .markdown h3,
  .markdown h4, .markdown h5, .markdown h6 { margin: 16px 0 6px; line-height: 1.25; }
  .markdown ul { margin: 6px 0; padding-left: 24px; }
  .markdown .md-step { display: flex; gap: 6px; margin: 6px 0; }
  .markdown .md-step-number { flex: 0 0 auto; font-weight: 600; }
  .markdown code.inline-code { padding: 1px 5px; border-radius: 4px; background: var(--code); }
  .code-language { position: absolute; top: 9px; left: 12px; color: var(--muted); font-size: 11px; }
  .copy-code { z-index: 1; }
  .download-link {
    display: inline-block;
    margin-top: 12px;
    padding: 6px 10px;
    border: 1px solid var(--line);
    border-radius: 6px;
    color: var(--accent);
    text-decoration: none;
  }
  .work-status {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 8px;
    color: var(--muted);
    font-size: 13px;
    font-variant-numeric: tabular-nums;
  }
  .work-indicator {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--accent);
    animation: work-pulse 1.2s ease-in-out infinite;
  }
  @keyframes work-pulse {
    50% { opacity: .35; }
  }
</style>
</head>
<body>
<header>
  <h1>Ticket → Code <span class="hint">Planner · Coder · Reviewer</span></h1>
  <button id="new">Nuevo chat</button>
</header>
<div id="chat"></div>
<form id="form">
  <textarea id="input" rows="2" placeholder="Escribe un ticket o una petición de cambio… (Enter envía, Shift+Enter nueva línea)"></textarea>
  <button id="send" type="submit">Enviar</button>
</form>
<script>
const chat = document.getElementById('chat'), input = document.getElementById('input'), send = document.getElementById('send');
let sessionId = null;
try { sessionId = localStorage.getItem('sid'); } catch (e) {}
function newSession() {
  sessionId = (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random().toString(16).slice(2)).replace(/[^A-Za-z0-9_-]/g, '');
  try { localStorage.setItem('sid', sessionId); } catch (e) {}
}
if (!sessionId || sessionId.length < 8) newSession();

function el(tag, cls, text) { const n = document.createElement(tag); if (cls) n.className = cls; if (text !== undefined) n.textContent = text; return n; }
function scroll() { chat.scrollTop = chat.scrollHeight; }
function formatElapsed(startedAt) {
  const seconds = Math.floor((performance.now() - startedAt) / 1000);
  const minutes = String(Math.floor(seconds / 60)).padStart(2, '0');
  const remainder = String(seconds % 60).padStart(2, '0');
  return `${minutes}:${remainder}`;
}

function addRow(parent, event) {
  const row = el('div', 'row');
  row.appendChild(el('span', 't', `${event.t ?? ''}s`));
  row.appendChild(el('span', `a ${event.agent || 'system'}`, event.agent || 'system'));
  row.appendChild(document.createTextNode(event.message || ''));

  if (event.data !== undefined) {
    const details = document.createElement('details');
    const summary = document.createElement('summary');
    summary.textContent = 'Detalles';
    const pre = document.createElement('pre');
    pre.textContent = typeof event.data === 'string'
      ? event.data
      : JSON.stringify(event.data, null, 2);

    details.append(summary, pre);
    row.appendChild(details);
  }

  parent.appendChild(row);
}

function appendInline(parent, text) {
  const token = /(\*\*[^*]+\*\*|`[^`]+`|\*[^*]+\*)/g;
  let last = 0, match;

  while ((match = token.exec(text)) !== null) {
    parent.appendChild(document.createTextNode(text.slice(last, match.index)));
    const value = match[0];

    if (value.startsWith('**')) {
      const strong = document.createElement('strong');
      strong.textContent = value.slice(2, -2);
      parent.appendChild(strong);
    } else if (value.startsWith('`')) {
      const code = document.createElement('code');
      code.className = 'inline-code';
      code.textContent = value.slice(1, -1);
      parent.appendChild(code);
    } else {
      const em = document.createElement('em');
      em.textContent = value.slice(1, -1);
      parent.appendChild(em);
    }
    last = token.lastIndex;
  }

  parent.appendChild(document.createTextNode(text.slice(last)));
}

function renderReply(parent, text) {
  parent.classList.add('markdown');
  const lines = text.replace(/\r\n?/g, '\n').split('\n');
  let paragraph = [];
  let list = null;

  function flushParagraph() {
    if (!paragraph.length) return;
    const p = document.createElement('p');
    appendInline(p, paragraph.join(' '));
    parent.appendChild(p);
    paragraph = [];
  }

  function flushList() {
    if (list) {
      parent.appendChild(list);
      list = null;
    }
  }

  function renderCode(codeLines, language) {
    const code = codeLines.join('\n').replace(/\n+$/, '');
    const block = el('div', 'code-block');
    const pre = document.createElement('pre');
    const codeElement = document.createElement('code');
    codeElement.textContent = code;
    pre.appendChild(codeElement);

    const label = language ? el('span', 'code-language', language) : null;
    const button = el('button', 'copy-code', '⧉');
    button.type = 'button';
    button.title = 'Copiar código';
    button.setAttribute('aria-label', 'Copiar código');

    button.addEventListener('click', async () => {
      try {
        if (navigator.clipboard && window.isSecureContext) {
          await navigator.clipboard.writeText(code);
        } else {
          const textarea = document.createElement('textarea');
          textarea.value = code;
          textarea.style.position = 'fixed';
          textarea.style.opacity = '0';
          document.body.appendChild(textarea);
          textarea.select();
          const copied = document.execCommand('copy');
          textarea.remove();
          if (!copied) throw new Error('Copy command failed');
        }
        button.textContent = '✓';
        setTimeout(() => { button.textContent = '⧉'; }, 1200);
      } catch (error) {
        button.title = 'No se pudo copiar';
        console.error('Could not copy code:', error);
      }
    });

    if (label) block.appendChild(label);
    block.append(button, pre);
    parent.appendChild(block);
  }

  for (let i = 0; i < lines.length; i++) {
    const opening = lines[i].match(/^\s*(`{3,}|~{3,})\s*([^\s]*)?.*$/);

    if (opening) {
      flushParagraph();
      flushList();

      const marker = opening[1][0];
      const markerLength = opening[1].length;
      const language = (opening[2] || '').trim();
      const codeLines = [];
      i++;

      while (i < lines.length) {
        const closing = lines[i].match(/^\s*(`+|~+)\s*$/);
        if (closing && closing[1][0] === marker && closing[1].length >= markerLength) break;
        codeLines.push(lines[i]);
        i++;
      }

      // Quita la indentación común de bloques anidados en listas Markdown.
      const indents = codeLines
        .filter(line => line.trim())
        .map(line => line.match(/^\s*/)[0].length);
      const indent = indents.length ? Math.min(...indents) : 0;
      renderCode(codeLines.map(line => line.slice(indent)), language);
      continue;
    }

    if (!lines[i].trim()) {
      flushParagraph();
      flushList();
      continue;
    }

    const heading = lines[i].match(/^\s*(#{1,6})\s+(.+?)\s*#*\s*$/);
    if (heading) {
      flushParagraph();
      flushList();
      const h = document.createElement(`h${heading[1].length}`);
      appendInline(h, heading[2]);
      parent.appendChild(h);
      continue;
    }

    const step = lines[i].match(/^\s*(\d+)[.)]\s+(.+)$/);
    if (step) {
      flushParagraph();
      flushList();
      const item = el('div', 'md-step');
      item.appendChild(el('span', 'md-step-number', `${step[1]}.`));
      const content = document.createElement('span');
      appendInline(content, step[2]);
      item.appendChild(content);
      parent.appendChild(item);
      continue;
    }

    const bullet = lines[i].match(/^\s*[-*+]\s+(.+)$/);
    if (bullet) {
      flushParagraph();
      if (!list || list.tagName !== 'UL') {
        flushList();
        list = document.createElement('ul');
      }
      const item = document.createElement('li');
      appendInline(item, bullet[1]);
      list.appendChild(item);
      continue;
    }

    flushList();
    paragraph.push(lines[i].trim());
  }

  flushParagraph();
  flushList();
}

async function sendMessage(text) {
  chat.appendChild(el('div', 'msg user', text));
  const bubble = el('div', 'msg'); const body = el('div');
  const startedAt = performance.now();
  const workStatus = el('div', 'work-status');
  workStatus.append(
    el('span', 'work-indicator'),
    el('span', 'work-label', 'Trabajando…'),
    el('time', 'work-elapsed', formatElapsed(startedAt))
  );
  const log = el('details', 'log');
  const summary = el('summary', '', 'Preparando actividad…'); const list = el('div');
  log.append(summary, list); bubble.append(log, body); chat.appendChild(bubble); scroll();
  send.disabled = true; input.disabled = true;
  let steps = 0, finished = false;
  const elapsedLabel = workStatus.querySelector('.work-elapsed');
  const workLabel = workStatus.querySelector('.work-label');
  const timer = window.setInterval(() => {
    elapsedLabel.textContent = formatElapsed(startedAt);
  }, 1000);
  const stopWorking = (label) => {
    finished = true;
    window.clearInterval(timer);
    workLabel.textContent = label;
    elapsedLabel.textContent = formatElapsed(startedAt);
    workStatus.querySelector('.work-indicator').style.animation = 'none';
  };
  const showError = (msg) => {
    bubble.classList.add('error');
    body.appendChild(el('div', 'text', msg));
    stopWorking('Falló');
  };
  bubble.insertBefore(workStatus, log);
  const handle = (ev) => {
    if (ev.type === 'log') {
      steps++;
      addRow(list, ev);
      summary.textContent = `Ahora: ${ev.agent || 'system'} — ${ev.message || 'Trabajando…'}`;
    }
    else if (ev.type === 'final') {
      stopWorking('Terminado');
      const labels = { approved: 'Aprobado', not_approved: 'No aprobado (reintentos agotados)', answer: 'Respuesta' };
      body.appendChild(el('span', 'badge ' + ev.status, labels[ev.status] + (ev.attempts ? ` · ${ev.attempts}/${ev.max_attempts} intentos` : '') + ` · ${ev.t}s`));
      renderReply(body, ev.reply);
      if (ev.file_count > 0) {
        const download = el('a', 'download-link', 'Descargar proyecto ZIP');
        download.href = `/api/sessions/${encodeURIComponent(sessionId)}/download`;
        download.download = 'project.zip';
        body.appendChild(download);
      }
    } else if (ev.type === 'error') {
      summary.textContent = `Ahora: ${ev.stage || 'system'} — ${ev.message}`;
      showError(`Falló en la etapa "${ev.stage}": ${ev.message}`);
    }
    scroll();
  };
  try {
    const res = await fetch('/api/chat', { method: 'POST', headers: { 'Content-Type': 'application/json' },
                                           body: JSON.stringify({ session_id: sessionId, message: text }) });
    if (!res.ok) { showError(`El servidor respondió ${res.status}. ${(await res.text()).slice(0, 200)}`); }
    else {
      const reader = res.body.getReader(), dec = new TextDecoder(); let buf = '';
      for (;;) {
        const { value, done } = await reader.read(); if (done) break;
        buf += dec.decode(value, { stream: true }); let i;
        while ((i = buf.indexOf('\n')) >= 0) { const line = buf.slice(0, i).trim(); buf = buf.slice(i + 1); if (line) handle(JSON.parse(line)); }
      }
      if (!finished) showError('La conexión se cerró antes de terminar. Revisa el log de arriba y vuelve a intentar.');
    }
  } catch (e) { showError('No se pudo contactar al servidor: ' + e.message); }
  window.clearInterval(timer);
  if (!finished) stopWorking('Falló');
  summary.textContent = `Log de agentes (${steps} pasos)`; log.open = false;
  send.disabled = false; input.disabled = false; input.focus(); scroll();
}

document.getElementById('form').addEventListener('submit', (e) => {
  e.preventDefault(); const text = input.value.trim(); if (!text) return; input.value = ''; sendMessage(text);
});
input.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); document.getElementById('form').requestSubmit(); } });
document.getElementById('new').addEventListener('click', () => { newSession(); chat.innerHTML = ''; });
chat.appendChild(el('div', 'hint', 'Escribe un ticket (por ejemplo: "Agregar validación de cupones de descuento al carrito"). Después puedes pedir cambios en el mismo hilo.'));
</script>
</body>
</html>
